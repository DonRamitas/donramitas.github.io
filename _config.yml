# Mostrar última modificación en los archivos
last_edit_timestamp: true
last_edit_time_format: "%d/%m/%Y"

# Footer personalizado (si lo deseas)
footer_content: "Hecho con 💻 y café por [@tuusuario](https://github.com/tuusuario)"

# Favicon (opcional)
favicon_ico: "/assets/favicon.ico"

# Inclusión de Google Analytics (opcional)
# ga_tracking: UA-XXXXXXXXX-X
