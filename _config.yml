title: Mi Proyecto Pulento 🚀
description: Documentación oficial y recursos de Mi Proyecto
theme: just-the-docs

# Dirección base si tu repo no está en la raíz
# Si tu repo es "https://github.com/tuusuario/miproyecto", usa esto:
baseurl: "/miproyecto"

# URL completa del sitio (opcional pero recomendado)
url: "https://tuusuario.github.io"

# Mostrar búsqueda (funciona muy bien con Just the Docs)
search_enabled: true

# Navegación en la barra lateral
nav_sort: case_insensitive

# Colores del tema
